# Configuración central del Pipeline FIRMS (Perú)

paths:
  modis: dataset/modis
  snpp: dataset/snpp
  noaa20: dataset/noaa20     # opcional: se omite si la carpeta no existe
  noaa21: dataset/noaa21     # opcional
  reports: output/reports
  interim: output/interim
  processed: output/processed

years:
  min: 2012
  max: 2017

windows:                     # ventanas documentadas para calibración y validación
  calibration: [2012, 2017]
  validation: [2018, 2022]
  final: [2012, 2022]        # reajuste final con años estables (Aqua deriva desde 2023: paso 13:51 y 14:16)

processing:
  utc_offset_hours: -5
  cell_size_deg: 0.25

seasons:                     # temporada de quema por mes (mes del jueves de la semana ISO)
  alta: [8, 9]               # ago-sep: ~60-65 % de las detecciones 2002-2024
  media: [6, 7, 10, 11]
  baja: [12, 1, 2, 3, 4, 5]

outages:                     # apagones documentados por NASA, sensor: [inicio, fin] (fechas inclusivas)
  Aqua: [2020-08-16, 2020-09-02]   # falla del FMU de Aqua (MODIS C6 Fire User Guide rev. C, sec. 7.2.4)
  SNPP: [2022-07-27, 2022-08-10]   # apagón de S-NPP VIIRS (VIIRS C2 Burned Area User Guide v1.1, sec. 8.2)

harmonize:                   # serie única: Aqua x factor (estimado) + VIIRS real
  estimated: [2002, 2011]    # tramo "estimado" (sin VIIRS); desde 2012 es "VIIRS real"
  aqua_start: 2002-07-04     # primer día con datos de Aqua: su semana se marca como parcial
  aqua_gaps: [2002-07-30, 2002-08-07, 2022-03-31, 2022-04-16]   # faltas de dato de Aqua no documentadas por NASA, pares inicio-fin (inclusivos); sus semanas quedan NaN
  band_coverage: 0.90        # cobertura de la banda de predicción semanal (cuantiles empíricos de validación)

climatology:                 # línea base y anomalías sobre la serie única
  baseline: [2003, 2024]     # años completos (2002 empieza en julio y tiene semanas sin dato)
  aoi_cusco: [-15.8, -11.2, -74.0, -70.3]   # PROVISIONAL: rectángulo lat_min, lat_max, lon_min, lon_max que contiene Cusco (incluye bordes de regiones vecinas)

static_mask:                 # ubicaciones estáticas (type 1/2 en cualquier sensor y año) excluidas de todos los años
  enabled: true
  cell_deg: 0.01             # celda de la máscara (~1,1 km, tamaño del píxel MODIS)
  buffer_cells: 1            # margen en celdas alrededor de cada celda estática (error de geolocalización MODIS)
  min_years: 2               # años distintos con type 1/2 para considerar la ubicación estática (persistencia)

alerts:
  max_gap_days: 3
  max_low_conf_pct: 40.0
  max_pass_shift_min: 60
  max_yoy_ratio_change: 0.30

bbox:
  lat_min: -18.5
  lat_max: 0.1
  lon_min: -81.5
  lon_max: -68.5
